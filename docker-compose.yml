services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: frank-burger-platform:latest
    container_name: frank-burger-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - FB_PIXEL_ID=${FB_PIXEL_ID:-}
      - FB_CAPI_ACCESS_TOKEN=${FB_CAPI_ACCESS_TOKEN:-}
      - FB_TEST_EVENT_CODE=${FB_TEST_EVENT_CODE:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
